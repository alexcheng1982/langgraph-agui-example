[project]
name = "cooking-agent"
version = "0.1.0"
description = "Cooking agent"
readme = "README.md"
authors = [
    { name = "Fu Cheng", email = "alexcheng1982@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ag-ui-langgraph>=0.0.41",
    "fastapi>=0.136.3",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "uvicorn>=0.49.0",
]

[project.scripts]
agent = "agent.app:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
